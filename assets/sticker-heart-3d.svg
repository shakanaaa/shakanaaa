<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170" role="img" aria-label="Glossy 3D heart sticker"><title>Glossy 3D heart sticker</title>
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:var(--o)}50%{transform:scale(.86);opacity:calc(var(--o)*.7)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.fl{animation:fl 4s ease-in-out infinite}
.sh{animation:sh 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fl,.sh,.tw{animation:none}}
</style><defs><radialGradient id="s_hg" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#E9E4F7"/><stop offset=".42" stop-color="#8250DF"/><stop offset="1" stop-color="#53389E"/></radialGradient><filter id="s_bl" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter></defs><g transform="translate(0 0) scale(1.6)"><ellipse class="sh" style="--o:0.35;animation-delay:0s" cx="50" cy="98" rx="24" ry="4.5" fill="#53389E" opacity="0.35" filter="url(#s_bl)"/><g class="fl" style="animation-delay:0s"><path d="M50 88 C10 58 6 28 28 20 C40 16 48 24 50 32 C52 24 60 16 72 20 C94 28 90 58 50 88 Z" fill="url(#s_hg)" stroke="#53389E" stroke-opacity=".55" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="62" cy="68" rx="15" ry="8" transform="rotate(-40 62 68)" fill="#E9E4F7" opacity=".28"/><ellipse cx="31" cy="35" rx="11" ry="6.5" transform="rotate(-38 31 35)" fill="#fff" opacity=".78"/><circle cx="21" cy="49" r="2.6" fill="#fff" opacity=".65"/></g></g><path class="tw" style="animation-delay:0s" transform="translate(136 24)" fill="#8250DF" d="M0 -9 Q1.6199999999999999 -1.6199999999999999 9 0 Q1.6199999999999999 1.6199999999999999 0 9 Q-1.6199999999999999 1.6199999999999999 -9 0 Q-1.6199999999999999 -1.6199999999999999 0 -9 Z"/><path class="tw" style="animation-delay:1.4s" transform="translate(22 36)" fill="#8250DF" d="M0 -6 Q1.08 -1.08 6 0 Q1.08 1.08 0 6 Q-1.08 1.08 -6 0 Q-1.08 -1.08 0 -6 Z"/>
</svg>
