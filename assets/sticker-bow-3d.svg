<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92" width="120" height="92" role="img" aria-label="Glossy 3D bow sticker"><title>Glossy 3D bow sticker</title>
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:var(--o)}50%{transform:scale(.86);opacity:calc(var(--o)*.7)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.fl{animation:fl 4s ease-in-out infinite}
.sh{animation:sh 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fl,.sh,.tw{animation:none}}
</style><defs><radialGradient id="bg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFD6EA"/><stop offset=".5" stop-color="#FF69B4"/><stop offset="1" stop-color="#C92A6A"/></radialGradient><radialGradient id="kg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFE3F1"/><stop offset=".55" stop-color="#FF8FC7"/><stop offset="1" stop-color="#D6457F"/></radialGradient><filter id="bb" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter></defs><ellipse class="sh" style="--o:.3" cx="60" cy="86" rx="38" ry="4.5" fill="#C92A6A" opacity=".3" filter="url(#bb)"/><g class="fl"><path d="M54 42 L38 74 L52 69 L59 79 L63 46 Z" fill="url(#bg)" stroke="#B81F5E" stroke-opacity=".5" stroke-width="1.2" stroke-linejoin="round"/><path d="M66 42 L82 74 L68 69 L61 79 L57 46 Z" fill="url(#bg)" stroke="#B81F5E" stroke-opacity=".5" stroke-width="1.2" stroke-linejoin="round"/><path d="M60 38 C40 8 6 10 8 38 C6 66 40 68 60 38 Z" fill="url(#bg)" stroke="#B81F5E" stroke-opacity=".55" stroke-width="1.2" stroke-linejoin="round"/><path d="M60 38 C80 8 114 10 112 38 C114 66 80 68 60 38 Z" fill="url(#bg)" stroke="#B81F5E" stroke-opacity=".55" stroke-width="1.2" stroke-linejoin="round"/><path d="M54 36 C40 20 22 20 20 36" fill="none" stroke="#FFB3D9" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/><path d="M66 36 C80 20 98 20 100 36" fill="none" stroke="#FFB3D9" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/><ellipse cx="26" cy="26" rx="9" ry="4.5" transform="rotate(-30 26 26)" fill="#fff" opacity=".7"/><ellipse cx="92" cy="26" rx="9" ry="4.5" transform="rotate(30 92 26)" fill="#fff" opacity=".45"/><ellipse cx="60" cy="40" rx="11" ry="12" fill="url(#kg)" stroke="#B81F5E" stroke-opacity=".5" stroke-width="1.2"/><ellipse cx="56" cy="35" rx="4.5" ry="3" transform="rotate(-30 56 35)" fill="#fff" opacity=".8"/></g>
</svg>
